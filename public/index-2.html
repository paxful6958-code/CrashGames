<body>

    <div class="main-wrapper">
        <div class="brand-logo-hero">
            <img src="../i.ibb.co/5WS8kMsY/4-F05-AFF4-AFC8-4-B60-9-F59-086-D08-FA8723.png" alt="CrashGame"> CrashGame
        </div>

        <div class="bonus-card">
            <div class="bonus-title">🎁 100% FREE AVIATOR SIGNALS 🎁</div>
            <div class="bonus-desc">
                🎰 Play Aviator 🚀 Get free accurate signals 🎯
            </div>
        </div>

        <div class="form-card">
            <div class="form-header">
                <h2 class="form-title">👤 LOG IN</h2>
                <p class="form-subtitle">Enter User ID and password to log in</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>🫆 User ID</label>
                    <input type="text" id="accountID" class="input-control" required placeholder="e.g. User_582910">
                </div>

                <div class="input-group">
                    <label>🔐 Password</label>
                    <input type="password" id="password" class="input-control" required placeholder="Enter your password">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">Remember User ID on this device</label>
                </div>

                <button type="submit" class="btn-submit">LOG IN</button>
            </form>

            <div style="text-align: center; font-size: 12px; margin-top: 14px; color: var(--text-muted);">
                Don't have an ID? <a href="register/index.html" style="color: var(--accent-cyan); font-weight: 700; text-decoration: none;">Register Now</a>
            </div>
        </div>

    <footer class="page-footer">
        &copy; 2026 CrashGame. All rights reserved.
    </footer>

    <div id="toast-container"></div>

    <script>
        document.addEventListener('touchend', (function() {
            let lastTouch = 0;
            return function(e) {
                const now = Date.now();
                if (now - lastTouch <= 300) {
                    e.preventDefault();
                }
                lastTouch = now;
            };
        })(), false);

        window.addEventListener('DOMContentLoaded', () => {
            const localData = localStorage.getItem('betrush_user');
            if (localData) {
                try {
                    const parsed = JSON.parse(localData);
                    if (parsed.accountID) {
                        document.getElementById('accountID').value = parsed.accountID;
                    }
                } catch (err) {}
            }
        });

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function handleLogin(e) {
            e.preventDefault();
            const accountID = document.getElementById('accountID').value.trim();
            const password = document.getElementById('password').value;

            if (!accountID) {
                showToast('Please enter your Account User ID');
                return;
            }

            if (!password) {
                showToast('Please enter your password');
                return;
            }

            const localData = localStorage.getItem('betrush_user');
            if (localData) {
                try {
                    const parsed = JSON.parse(localData);

                    if (parsed.accountID === accountID && parsed.password === password) {
                        localStorage.setItem('betrush_session', accountID);
                        showToast('Login Successful!');

                        setTimeout(() => {
                            window.location.href = 'dashboard/index.html';
                        }, 1000);
                        return;
                    } else {
                        showToast('Incorrect User ID or password');
                        return;
                    }
                } catch (err) {}
            }

            showToast('Account not found. Register first.');
        }
    </script>
</body>
