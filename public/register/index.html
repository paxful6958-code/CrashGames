<body>

    <div class="main-wrapper">
        <div class="brand-logo-hero">

                </div>

                <h2 class="form-title">👤 Registration</h2>
                <p class="form-subtitle">Set up your credentials to get started</p>
            </div>

            <form id="registrationForm" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label for="accountID">🫆 User ID</label>
                    <input type="text" id="accountID" class="input-control" required readonly style="cursor: default; opacity: 0.9;">
                </div>

                <div class="input-group">
                    <label for="password">🔐 Password</label>
                    <input type="password" id="password" class="input-control" required placeholder="Enter your password">
                </div>

                <div class="input-group">
                    <label for="referredBy">🤝 Referred By (Optional)</label>
                    <input type="text" id="referredBy" class="input-control" placeholder="Enter referrer ID (e.g. User_123456)">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required checked>
                    <label for="terms">I am 18+ and accept Terms & Conditions</label>
                </div>

                <button type="submit" class="btn-submit">REGISTER</button>
            </form>

            <div style="text-align: center; font-size: 12px; margin-top: 14px; color: var(--text-muted);">
                Already registered? <a href="../index.html" style="color: var(--accent-cyan); font-weight: 700; text-decoration: none;">Log In</a>
            </div>
        </div>

    <footer class="page-footer">

    </footer>

    <div id="toast-container"></div>

    <script>
        document.addEventListener('touchend', (function() {
            let lastTouch = 0;
            return function(e) {
                const now = Date.now();
                if (now - lastTouch <= 300) {
                    e.preventDefault();
                }
                lastTouch = now;
            };
        })(), false);

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function extractReferralCode() {
            const search = window.location.search;
            if (!search) return null;

            const urlParams = new URLSearchParams(search);
            const refParam = urlParams.get('ref') || urlParams.get('referred_by') || urlParams.get('referral');

            if (refParam) return refParam.trim();

            const rawQuery = search.substring(1).split('&')[0];
            if (rawQuery && !rawQuery.includes('=')) {
                return decodeURIComponent(rawQuery.trim());
            }

            return null;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const randomUserID = 'User_' + getRandomInt(100000, 999999);
            document.getElementById('accountID').value = randomUserID;

            const detectedRef = extractReferralCode();
            if (detectedRef) {
                localStorage.setItem('betrush_referred_by', detectedRef);
            }

            const activeRef = localStorage.getItem('betrush_referred_by');
            if (activeRef) {
                const refInput = document.getElementById('referredBy');
                refInput.value = activeRef;
                refInput.readOnly = true;
                refInput.style.opacity = '0.85';
                refInput.style.color = 'var(--accent-cyan)';
                refInput.style.fontWeight = '700';
            }
        });

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function handleRegister(e) {
            e.preventDefault();

            const accountID = document.getElementById('accountID').value;
            const password = document.getElementById('password').value;
            const referredBy = document.getElementById('referredBy').value.trim();

            if (!password || password.trim() === '') {
                showToast('Please enter a password');
                return;
            }

            const userData = {
                accountID: accountID,
                password: password,
                referredBy: referredBy || null,
                bonusActive: 'Free Aviator Signals',
                registeredAt: new Date().toISOString()
            };

            localStorage.setItem('betrush_user', JSON.stringify(userData));
            localStorage.setItem('betrush_session', accountID);

            showToast('Registered! Redirecting...');

            setTimeout(() => {
                window.location.href = '../dashboard/index.html';
            }, 1000);
        }
    </script>
